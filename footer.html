<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>footer</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <footer class="bg-gray-800 text-white">

    <div class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-12 py-10">

        <!-- Footer Grid -->
        <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3
                   gap-8 lg:gap-16"
        >

            <!-- Brand -->
            <div class="text-center sm:text-left">

                <h2 class="text-2xl sm:text-3xl font-bold text-white">
                    <a href="#home" class="hover:text-blue-400 transition">
                        EliteMart
                    </a>
                </h2>

                <p class="mt-3 text-gray-300 leading-6 max-w-sm mx-auto sm:mx-0">
                    Your trusted online mart for quality products,
                    affordable prices, and a smooth shopping experience.
                </p>

            </div>


            <!-- Quick Links -->
            <div class="text-center sm:text-left">

                <h3 class="text-lg font-semibold mb-4">
                    Quick Links
                </h3>

                <ul class="space-y-2">

                    <li>
                        <a
                            href="#home"
                            class="text-gray-300 hover:text-blue-400 transition"
                        >
                            Home
                        </a>
                    </li>

                    <li>
                        <a
                            href="#about"
                            class="text-gray-300 hover:text-blue-400 transition"
                        >
                            About
                        </a>
                    </li>

                    <li>
                        <a
                            href="#cart"
                            class="text-gray-300 hover:text-blue-400 transition"
                        >
                            Services
                        </a>
                    </li>

                    <li>
                        <a
                            href="#aboutMart"
                            class="text-gray-300 hover:text-blue-400 transition"
                        >
                            Why Me?
                        </a>
                    </li>

                    <li>
                        <a
                            href="#contact"
                            class="text-gray-300 hover:text-blue-400 transition"
                        >
                            Contact
                        </a>
                    </li>

                </ul>

            </div>


            <!-- Social Links -->
            <div class="text-center sm:text-left">

                <h3 class="text-lg font-semibold mb-4">
                    Connect With Me
                </h3>

                <div class="flex justify-center sm:justify-start gap-4">

                    <a
                        href="https://github.com/Amna-luqman-dev"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="px-4 py-2 bg-gray-700 rounded-lg
                               hover:bg-gray-600 transition"
                    >
                        GitHub
                    </a>

                    <a
                        href="https://www.linkedin.com/in/amna-luqman-dev/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="px-4 py-2 bg-gray-700 rounded-lg
                               hover:bg-blue-600 transition"
                    >
                        LinkedIn
                    </a>

                </div>

            </div>

        </div>


        <!-- Divider -->
        <div class="border-t border-gray-700 mt-10 pt-6">

            <p class="text-center text-gray-400 text-sm">
                © 2026 EliteMart. All Rights Reserved.
            </p>

        </div>

    </div>

</footer>
</body>
</html>
